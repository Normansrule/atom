name: Bug report
description: Something on the website or in the Mac app doesn't work.
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options: ["Website", "Mac app", "Both"]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Browser or macOS version
      placeholder: "Safari on macOS 26, Chrome on Windows 11, iPhone with iOS 26"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it?
      description: The steps, and a screenshot if you can.
