# Release: push a tag like v1.0.1 and this builds Atom for macOS, Windows, and
# Linux on GitHub's machines, tests the Windows and Linux builds by starting
# them, and publishes all of them in one GitHub release whose notes come from
# CHANGELOG.md, with a SHA256SUMS.txt file of checksums.
#
# Optional secrets for the Mac app (Settings > Secrets and variables > Actions).
# Without them it is signed ad hoc and people approve it once in System Settings.
#   MACOS_CERT_P12        base64 of your "Developer ID Application" certificate (.p12)
#   MACOS_CERT_PASSWORD   the password that .p12 was exported with
#   APPLE_ID              the Apple ID email of your developer account
#   APPLE_TEAM_ID         your 10-character Team ID
#   APPLE_APP_PASSWORD    an app-specific password made at account.apple.com
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  check:
    name: The tag matches VERSION
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but VERSION says $(cat VERSION)"; exit 1; }

  mac:
    name: macOS
    needs: check
    runs-on: macos-14
    timeout-minutes: 40
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Load the signing certificate (only if the secrets exist)
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/atom.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$ID" || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          xcrun notarytool store-credentials atom-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          echo "DEVELOPER_ID=$ID" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=atom-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build
        run: sh mac/build-mac-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/Atom-mac.zip
          if-no-files-found: error

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the build tools
        working-directory: desktop
        run: npm ci
      - name: Build the installer and the portable zip
        working-directory: desktop
        run: node build.mjs win
      - name: Start the app and run its self-test
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1
          node desktop/smoke-desktop.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            desktop/dist/Atom-Windows-Setup.exe
            desktop/dist/Atom-Windows-portable.zip
          if-no-files-found: error

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the build tools
        working-directory: desktop
        run: npm ci
      - name: Build the AppImage and the .deb
        working-directory: desktop
        run: node build.mjs linux
      - name: Start the app and run its self-test
        run: |
          # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox uses
          # unless an app is installed with its AppArmor profile; allow them here
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install --no-save --no-audit --no-fund playwright-core@1
          xvfb-run -a node desktop/smoke-desktop.mjs
      - name: The AppImage itself starts and runs its self-test
        run: |
          chmod +x desktop/dist/Atom-Linux.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ATOM_EXE=desktop/dist/Atom-Linux.AppImage xvfb-run -a node desktop/smoke-desktop.mjs
      - name: The .deb installs and its files are where they belong
        run: |
          sudo apt-get update
          sudo apt-get install -y ./desktop/dist/Atom-Linux.deb
          dpkg -L atom-periodic-table | grep -E "atom-periodic-table$|\.desktop$"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            desktop/dist/Atom-Linux.AppImage
            desktop/dist/Atom-Linux.deb
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [mac, windows, linux]
    runs-on: ubuntu-24.04
    env:
      MAC_SIGNED: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum Atom-mac.zip Atom-Windows-Setup.exe Atom-Windows-portable.zip Atom-Linux.AppImage Atom-Linux.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          V="$(cat VERSION)"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {if(on) exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Atom $V" > notes.md
          cat >> notes.md <<'EOF'

          ## Downloads

          | Your computer | Download |
          | --- | --- |
          | Mac (Apple silicon or Intel, macOS 12 or later) | **Atom-mac.zip** |
          | Windows 10 or 11 (64-bit) | **Atom-Windows-Setup.exe** (installer), or **Atom-Windows-portable.zip** (no install) |
          | Linux (64-bit) | **Atom-Linux.deb** (Debian, Ubuntu, Mint), or **Atom-Linux.AppImage** (any distribution) |

          Or skip the download: https://normansrule.github.io/atom/

          EOF
          if [ "$MAC_SIGNED" = "true" ]; then
            echo "The Mac app is signed and notarized by Apple. The Windows builds aren't signed by Microsoft yet, so Windows may ask you to confirm the first launch: choose **More info**, then **Run anyway**. The checksums of every file are in **SHA256SUMS.txt**." >> notes.md
          else
            echo "These builds aren't signed by Apple or Microsoft yet, so the first launch asks you to confirm. On a Mac: try to open Atom, then choose **Open Anyway** in System Settings > Privacy & Security. On Windows: choose **More info**, then **Run anyway**. The checksums of every file are in **SHA256SUMS.txt**." >> notes.md
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="out/Atom-mac.zip out/Atom-Windows-Setup.exe out/Atom-Windows-portable.zip out/Atom-Linux.AppImage out/Atom-Linux.deb out/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" $FILES --title "Atom $(cat VERSION)" --notes-file notes.md
          fi
