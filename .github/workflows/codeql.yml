# CodeQL: GitHub's own code scanner reads the scripts, the build tools, and these workflows for known kinds of
# security mistakes, on every push, on pull requests, and once a week (new checks arrive without a push).
# Findings appear under Security > Code scanning. This run does not gate a release; Verify does.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 6 * * 1"
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Code scanning (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # the app is one file that also ships as the site's parts: read the parts, not the copies; packs are data
          config: |
            paths-ignore:
              - app/atom.html
              - docs/app/index.html
              - app/i18n
              - docs/assets/i18n
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
