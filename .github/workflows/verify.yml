# Verify: on every push and pull request, check the website and the in-browser
# app the way GitHub Pages serves them, and compile the Mac app on a real Mac.
name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    # Safari, every iPhone and iPad, and the Mac app run WebKit; Firefox is
    # its own engine. A page that only passes in Chromium is not finished.
    name: Website and in-browser app in ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # WebKit and Firefox are advisory until they have been seen green once;
    # then delete this line so a Safari-only break fails the push
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the checkers
        run: npm install --no-save --no-audit --no-fund playwright@1.64.1 axe-core@4.14.0 html-validate@11.17.0
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Validate the HTML
        if: matrix.browser == 'chromium'
        run: npx html-validate docs/index.html docs/404.html docs/teachers.html docs/handout.html app/atom.html
      - name: Every style sheet's braces balance, and nothing is declared outside a rule
        if: matrix.browser == 'chromium'
        run: python3 scripts/check_css.py
      - name: The English catalog matches the pages, and every language pack passes its checks
        if: matrix.browser == 'chromium'
        run: |
          cp i18n/en.catalog.json /tmp/catalog-committed.json
          python3 scripts/i18n/i18n_tool.py extract .
          cmp /tmp/catalog-committed.json i18n/en.catalog.json || { echo "i18n/en.catalog.json is stale: run python3 scripts/i18n/i18n_tool.py extract ."; exit 1; }
          # every pack is data (JSON), complete, and well formed; the checker exits 1 on anything else
          python3 scripts/i18n/i18n_tool.py check .
      - name: The served language files and the service worker's stamp come from the sources
        if: matrix.browser == 'chromium'
        run: |
          mkdir -p /tmp/served && cp -r app/i18n /tmp/served/app && cp -r docs/assets/i18n /tmp/served/site
          python3 scripts/i18n/i18n_tool.py build .
          diff -r /tmp/served/app app/i18n && diff -r /tmp/served/site docs/assets/i18n || { echo "the served packs are stale: run python3 scripts/i18n/i18n_tool.py build ."; exit 1; }
          python3 scripts/stamp_sw.py --check
      - name: Load every page, run the self-tests, check accessibility
        run: node scripts/smoke.mjs
        env:
          ATOM_BROWSER: ${{ matrix.browser }}
      - name: The site and the app come from the same source
        if: matrix.browser == 'chromium'
        run: cmp app/atom.html docs/app/index.html
      - name: The site's generated files come from the app
        if: matrix.browser == 'chromium'
        run: |
          sh scripts/extract-site.sh app/atom.html /tmp/extract >/dev/null
          for f in atom-i18n.js atom-engines.js atom-ptable.js atom-labs.js atom-labs.css atom-data.js; do
            cmp /tmp/extract/$f docs/assets/$f || { echo "docs/assets/$f is not what app/atom.html contains"; exit 1; }
          done
          for f in app/i18n/*.js; do
            cmp "$f" "docs/assets/i18n/$(basename "$f")" || { echo "docs/assets/i18n/$(basename "$f") is not what app/i18n holds"; exit 1; }
          done

  mac:
    name: Mac app builds
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build (signed ad hoc)
        run: sh mac/build-mac-app.sh
      - name: The app launches and stays up
        run: |
          open dist/Atom.app
          sleep 15
          pgrep -x Atom
          pkill -x Atom || true
      - uses: actions/upload-artifact@v7
        with:
          name: Atom-mac
          path: |
            dist/Atom-mac.zip
            dist/Atom-mac.zip.sha256
          retention-days: 14

  desktop:
    name: Desktop app on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the build tools
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        shell: bash
        run: node build.mjs ${{ runner.os == 'Windows' && 'win' || 'linux' }}
      - name: Start the app and run its self-test (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1
          node desktop/smoke-desktop.mjs
      - name: Start the app and run its self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install --no-save --no-audit --no-fund playwright-core@1
          xvfb-run -a node desktop/smoke-desktop.mjs
          chmod +x desktop/dist/Atom-Linux.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ATOM_EXE=desktop/dist/Atom-Linux.AppImage xvfb-run -a node desktop/smoke-desktop.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/dist/smoke-*.png
            desktop/dist/Atom-*
          retention-days: 14
